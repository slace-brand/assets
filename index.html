<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brand Assets — SLACE</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #ffffff;
    margin: 0;
    display: flex;
    color: #222;
  }

  /* SIDEBAR */
  .sidebar {
    width: 220px;
    min-height: 100vh;
    border-right: 1px solid #eee;
    padding: 20px;
    flex-shrink: 0;
  }
  .sidebar .logo {
    display: block;
    max-width: 100px;
    margin-bottom: 6px;
  }
  .sidebar .brand-name {
    font-size: 12px;
    color: #999;
    margin: 0 0 30px 0;
    letter-spacing: 0.3px;
  }
  .category-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .category-list li {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    margin-bottom: 4px;
    color: #444;
  }
  .category-list li:hover {
    background: #f5f5f5;
  }
  .category-list li.active {
    background: #eee;
    color: #222;
    font-weight: 600;
  }

  /* MAIN CONTENT */
  .main {
    flex: 1;
    padding: 30px 40px;
  }
  .main h1 {
    font-size: 22px;
    margin-bottom: 25px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
  }
  .card {
    border: 1px solid #eee;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    height: 140px;
    object-fit: contain;
    background: #fafafa;
    padding: 10px;
  }
  .card-body {
    padding: 12px;
  }
  .card-body p {
    margin: 0 0 10px 0;
    font-size: 13px;
    font-weight: 600;
  }
  .card-body a {
    display: inline-block;
    background: #26BBDE;
    color: #fff;
    text-decoration: none;
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .card-body a:hover {
    background: #1c9bb8;
  }

  .swatch {
    width: 100%;
    height: 140px;
  }
</style>
</head>
<body>

<div class="sidebar">
  <img class="logo" src="logo.png" alt="SLACE logo">
  <p class="brand-name">Brand Assets</p>
  <ul class="category-list" id="categoryList">
    <!-- generated automatically via JS -->
  </ul>
</div>

<div class="main">
  <h1 id="categoryTitle"></h1>
  <div class="grid" id="assetGrid">
    <!-- generated automatically via JS -->
  </div>
</div>

<script>
  // Replace with your published Google Sheets CSV link
  // (File → Share → Publish to web → format: CSV)
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTSoqf3ipT2bFA3IDxFYbfNUuzi-tg2M3lOr0z7mjVz4OZPo8DUdvjULLzPG5yJk_vMQBhHNPL4v_9S/pub?gid=0&single=true&output=csv";

  function thumbUrl(id) {
    return `https://drive.google.com/thumbnail?id=${id}&sz=w400`;
  }
  function downloadUrl(id) {
    return `https://drive.google.com/uc?export=download&id=${id}`;
  }

  function parseCSV(text) {
    const rows = text.trim().split("\n").map(r => r.split(","));
    const headers = rows[0].map(h => h.trim());
    return rows.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (row[i] || "").trim());
      return obj;
    });
  }

  function renderCard(a) {
    if (a.type === "color") {
      return `
        <div class="card">
          <div class="swatch" style="background:#${a.hex}"></div>
          <div class="card-body">
            <p>${a.name}</p>
            <a onclick="navigator.clipboard.writeText('#${a.hex}'); alert('Copied #${a.hex}');">Copy HEX</a>
          </div>
        </div>`;
    }
    return `
      <div class="card">
        <img src="${thumbUrl(a.driveId)}" alt="${a.name}">
        <div class="card-body">
          <p>${a.name}</p>
          <a href="${downloadUrl(a.driveId)}" target="_blank">Download</a>
        </div>
      </div>`;
  }

  function renderGrid(assets, filter) {
    const grid = document.getElementById("assetGrid");
    grid.innerHTML = "";
    const filtered = assets.filter(a => a.category === filter);
    filtered.forEach(a => grid.innerHTML += renderCard(a));
  }

  function buildSidebar(assets) {
    const categories = [...new Set(assets.map(a => a.category))];
    const categoryList = document.getElementById("categoryList");
    const title = document.getElementById("categoryTitle");

    categories.forEach((cat, i) => {
      const li = document.createElement("li");
      li.textContent = cat;
      if (i === 0) li.classList.add("active");
      li.addEventListener("click", () => {
        document.querySelectorAll(".category-list li").forEach(el => el.classList.remove("active"));
        li.classList.add("active");
        title.textContent = cat;
        renderGrid(assets, cat);
      });
      categoryList.appendChild(li);
    });

    if (categories.length > 0) {
      title.textContent = categories[0];
      renderGrid(assets, categories[0]);
    }
  }

  // Load asset data from the published Google Sheet
  fetch(SHEET_CSV_URL)
    .then(res => res.text())
    .then(text => {
      const assets = parseCSV(text);
      buildSidebar(assets);
    })
    .catch(err => {
      document.getElementById("assetGrid").innerHTML = "<p>Could not load assets. Check the sheet link.</p>";
      console.error(err);
    });
</script>

</body>
</html>
